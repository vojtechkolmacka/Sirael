<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sirael</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d84f88">
  <style>
    :root {
      --bg: #111017;
      --card: #1c1a26;
      --card-border: #2c283d;
      --primary: #d84f88;
      --primary-hover: #f0629a;
      --text: #f3f2f8;
      --text-muted: #9e9bb0;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

    /* Navigační panel */
    header { background: var(--card); border-bottom: 1px solid var(--card-border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: #2a2538; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }

    /* Hlavní obsah */
    main { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; padding-bottom: 80px; }
    .view { display: none; }
    .view.active { display: block; }

    /* Avatar & Chat karta */
    .avatar-hero { text-align: center; margin-bottom: 16px; }
    .avatar-circle { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--primary); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; background: #262135; font-size: 2.2rem; }
    .friend-name { font-size: 1.4rem; font-weight: 700; }

    .chat-box { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 14px; min-height: 220px; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .msg { padding: 8px 12px; border-radius: 10px; font-size: 0.95rem; max-width: 80%; line-height: 1.4; }
    .msg.sirael { background: #2a2235; border: 1px solid var(--primary); align-self: flex-start; }
    .msg.user { background: var(--primary); color: #fff; align-self: flex-end; }

    /* Vstup chatu */
    .chat-controls { display: flex; gap: 8px; }
    input[type="text"], textarea, select { width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); color: #fff; font-size: 1rem; }
    input[type="text"]:focus, textarea:focus, select:focus { outline: 1px solid var(--primary); }
    button { background: var(--primary); color: #fff; border: none; border-radius: var(--radius); padding: 12px 18px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.97); }
    button.secondary { background: #2b273b; border: 1px solid var(--card-border); }

    /* Karty a seznamy */
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { font-size: 0.75rem; background: #3b2c44; color: var(--primary); padding: 3px 8px; border-radius: 6px; }

    /* Spodní záložková lišta */
    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 20; }
    .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 12px; }
    .nav-btn.active { color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <div style="font-weight: 700; font-size: 1.1rem;" id="headerName">Sirael</div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="systemStatus">Připravena</span>
    </div>
  </header>

  <main>
    <!-- ZÁLOŽKA 1: CHAT / HLAVNÍ -->
    <section id="view-chat" class="view active">
      <div class="avatar-hero">
        <div class="avatar-circle">💖</div>
        <div class="friend-name" id="displayHeroName">Sirael</div>
      </div>

      <div class="chat-box" id="chatHistory">
        <!-- Zprávy se plní dynamicky -->
      </div>

      <div class="chat-controls">
        <input type="text" id="chatInput" placeholder="Napiš zprávu...">
        <button id="btnSend">Odeslat</button>
      </div>
    </section>

    <!-- ZÁLOŽKA 2: KNIHOVNA ODPOVĚDÍ -->
    <section id="view-library" class="view">
      <h2 style="margin-bottom: 12px;">Knihovna odpovědí</h2>
      
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input type="text" id="libSearch" placeholder="Hledat spouštěč nebo odpověď...">
        <select id="libFilterCategory" style="max-width: 140px;">
          <option value="">Všechny</option>
          <option value="Romantika a něha">Romantika</option>
          <option value="Flirt">Flirt</option>
          <option value="Humor">Humor</option>
          <option value="Běžný rozhovor">Běžný</option>
          <option value="Intimní témata pro dospělé">Intimní</option>
        </select>
      </div>

      <button id="btnOpenNewItemModal" style="width: 100%; margin-bottom: 16px;">+ Přidat novou odpověď</button>

      <!-- Formulář pro novou položku -->
      <div id="modalNewItem" class="card" style="display: none;">
        <h3 style="margin-bottom: 10px;">Nová situace / odpověď</h3>
        <input type="text" id="newTitle" placeholder="Název (např. Návrat z práce)" style="margin-bottom: 8px;">
        <input type="text" id="newTrigger" placeholder="Spouštěč (např. Když přijdu domů)" style="margin-bottom: 8px;">
        <select id="newCategory" style="margin-bottom: 8px;">
          <option value="Romantika a něha">Romantika a něha</option>
          <option value="Flirt">Flirt</option>
          <option value="Humor">Humor</option>
          <option value="Běžný rozhovor">Běžný rozhovor</option>
          <option value="Intimní témata pro dospělé">Intimní témata pro dospělé</option>
        </select>
        <textarea id="newResponse" rows="3" placeholder="Co má odpovědět..." style="margin-bottom: 8px;"></textarea>
        <div style="display: flex; gap: 8px;">
          <button id="btnSaveNewItem">Uložit položku</button>
          <button id="btnCancelNewItem" class="secondary">Zrušit</button>
        </div>
      </div>

      <div id="libraryList">
        <!-- Karty knihovny se plní dynamicky -->
      </div>

      <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 20px 0;">
      <h3 style="margin-bottom: 8px; font-size: 1rem;">Zálohování knihovny</h3>
      <div style="display: flex; gap: 8px;">
        <button id="btnExportLib" class="secondary" style="flex: 1;">Export (JSON)</button>
        <label class="secondary" style="flex: 1; padding: 12px; border-radius: var(--radius); text-align: center; border: 1px solid var(--card-border); cursor: pointer;">
          Import
          <input type="file" id="fileImportLib" accept=".json" style="display: none;">
        </label>
      </div>
    </section>

    <!-- ZÁLOŽKA 3: PAMĚŤ -->
    <section id="view-memory" class="view">
      <h2 style="margin-bottom: 12px;">Osobní paměť</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">Uložená fakta a preference, které si o tobě pamatuje.</p>
      
      <div class="card">
        <input type="text" id="memFactInput" placeholder="Nové zjištění (např. Mám rád kávu bez cukru)" style="margin-bottom: 8px;">
        <button id="btnSaveMemory" style="width: 100%;">Uložit do paměti</button>
      </div>

      <div id="memoryList">
        <!-- Položky paměti -->
      </div>
    </section>

    <!-- ZÁLOŽKA 4: NASTAVENÍ -->
    <section id="view-settings" class="view">
      <h2 style="margin-bottom: 12px;">Nastavení</h2>

      <div class="card">
        <label style="font-weight: 600; display: block; margin-bottom: 6px;">Jméno přítelkyně</label>
        <input type="text" id="settingNameInput" style="margin-bottom: 8px;">
        <label style="font-weight: 600; display: block; margin-bottom: 6px;">Jak tě má oslovovat</label>
        <input type="text" id="settingUserNick" placeholder="např. miláčku, Vojto" style="margin-bottom: 12px;">
        <button id="btnSaveSettings" style="width: 100%;">Uložit změny jména</button>
      </div>

      <div class="card">
        <div style="font-weight: 600; margin-bottom: 6px;">PWA & Lokální data</div>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">Všechna data jsou uložena výhradně lokálně v tvém zařízení (IndexedDB).</p>
        <button id="btnInstallPwa" class="secondary" style="width: 100%; display: none; margin-bottom: 8px;">📲 Přidat aplikaci na plochu</button>
      </div>
    </section>
  </main>

  <!-- Spodní navigační lišta -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="view-chat">💬 Chat</button>
    <button class="nav-btn" data-view="view-library">📚 Knihovna</button>
    <button class="nav-btn" data-view="view-memory">🧠 Paměť</button>
    <button class="nav-btn" data-view="view-settings">⚙️ Nastavení</button>
  </nav>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
