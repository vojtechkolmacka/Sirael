<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sirael</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff4d6d">
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* Zajištění správného zobrazení i při výpadku externího CSS */
    :root {
      --bg-main: #0f1015;
      --bg-card: #181920;
      --bg-input: #232530;
      --accent: #ff4d6d;
      --text-main: #f0f0f5;
      --text-dim: #9092a0;
      --border: #2e303e;
    }
    body { background-color: var(--bg-main); color: var(--text-main); margin: 0; font-family: sans-serif; }
    .tab-view { display: none; padding: 16px; }
    .tab-view.active { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="avatar-badge">
      <div class="avatar-circle">💋</div>
      <div>
        <h2 id="header-name" style="font-size:1.1rem; margin:0;">Sirael</h2>
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span id="app-status">Připravena</span>
        </div>
      </div>
    </div>
  </header>

  <!-- LIŠTA STAVU MODELU -->
  <div id="ai-status-banner" style="background:#181920; border-bottom:1px solid var(--border); padding:10px 16px; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center;">
    <span id="ai-model-status" style="color:var(--text-dim);">Lokální model nepřipojen</span>
    <button id="btn-load-ai" class="btn" style="width:auto; padding:6px 14px; font-size:0.8rem; margin:0;">Aktivovat AI</button>
  </div>
  <div id="ai-progress-bar" style="display:none; height:4px; background:var(--accent); width:0%; transition:width 0.2s;"></div>

  <main>
    <!-- ZÁLOŽKA 1: CHAT -->
    <section id="view-chat" class="tab-view active">
      <div class="chat-container">
        <div id="chat-history" class="chat-history">
          <div class="msg ai">Ahoj! Jsem ráda, že jsme spolu. Můžeš nahoře kliknout na „Aktivovat AI“ a začít se mnou volně mluvit! ❤️</div>
        </div>
        <form id="chat-form" class="chat-input-bar">
          <input type="text" id="chat-input" placeholder="Napiš zprávu..." autocomplete="off">
          <button type="submit" class="btn">Odeslat</button>
        </form>
      </div>
    </section>

    <!-- ZÁLOŽKA 2: KNIHOVNA ODPOVĚDÍ -->
    <section id="view-library" class="tab-view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3>Knihovna odpovědí</h3>
        <button id="btn-add-lib" class="btn" style="width:auto; padding:6px 14px;">+ Přidat</button>
      </div>
      
      <input type="text" id="lib-search" placeholder="Hledat v názvech, spouštěčích a štítcích...">
      
      <div class="filter-row">
        <select id="lib-filter-cat">
          <option value="all">Všechny kategorie</option>
        </select>
      </div>

      <div id="lib-items"></div>

      <div class="card" style="margin-top:20px;">
        <label>Záloha a přenos dat</label>
        <div class="btn-group">
          <button id="btn-export-lib" class="btn btn-secondary">Export JSON</button>
          <label class="btn btn-secondary" style="text-align:center; margin:0; line-height:2.4;">
            Import JSON
            <input type="file" id="lib-file-import" accept=".json" style="display:none;">
          </label>
        </div>
      </div>
    </section>

    <!-- ZÁLOŽKA 3: OSOBNÍ PAMĚŤ -->
    <section id="view-memory" class="tab-view">
      <h3>Osobní paměť</h3>
      <p style="font-size:0.85rem; color:var(--text-dim); margin-bottom:12px;">Fakta, preference a informace, které si o tobě pamatuji.</p>
      
      <form id="memory-form" style="display:flex; gap:8px; margin-bottom:16px;">
        <input type="text" id="mem-input" placeholder="Nová vzpomínka či fakt..." style="margin-bottom:0;">
        <button type="submit" class="btn" style="width:auto; padding:0 16px;">Uložit</button>
      </form>

      <div id="memory-items"></div>

      <button id="btn-clear-mem" class="btn btn-danger" style="margin-top:20px;">Vymazat celou paměť</button>
    </section>

    <!-- ZÁLOŽKA 4: NASTAVENÍ A JMÉNO -->
    <section id="view-settings" class="tab-view">
      <h3>Nastavení přítelkyně</h3>
      
      <form id="settings-form" style="margin-top:14px;">
        <div class="card">
          <label>Jméno virtuální přítelkyně</label>
          <input type="text" id="set-name" required>

          <label>Alternativní oslovení / přezdívky</label>
          <input type="text" id="set-alt-names" placeholder="Oddělte čárkou">

          <label>Fonetická výslovnost</label>
          <input type="text" id="set-pronounce" placeholder="Jak jméno čte syntéza">

          <label>Jak tě má oslovovat</label>
          <input type="text" id="set-user-name" placeholder="Např. Vojto, miláčku">
        </div>

        <div class="card">
          <label>Míra romantiky (1 - 5)</label>
          <input type="number" id="set-romance" min="1" max="5">

          <label>Míra flirtu (1 - 5)</label>
          <input type="number" id="set-flirt" min="1" max="5">
        </div>

        <button type="submit" class="btn">Uložit nastavení</button>
      </form>
    </section>
  </main>

  <!-- MODÁLNÍ OKNO PRO KNIHOVNU ODPOVĚDÍ -->
  <div id="lib-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; padding:20px; overflow-y:auto;">
    <div class="card" style="margin-top:20px;">
      <h3 style="margin-bottom:12px;">Upravit / Přidat odpověď</h3>
      <form id="lib-form">
        <input type="hidden" id="modal-lib-id">
        
        <label>Název</label>
        <input type="text" id="modal-lib-title" required>

        <label>Spouštěč / Situace</label>
        <input type="text" id="modal-lib-trigger" placeholder="Např. Když řeknu že jsem unavený" required>

        <label>Odpověď</label>
        <textarea id="modal-lib-response" rows="3" required></textarea>

        <label>Kategorie</label>
        <select id="modal-lib-cat"></select>

        <label>Štítky (oddělené čárkou)</label>
        <input type="text" id="modal-lib-tags">

        <label>Varianty odpovědi (každá na nový řádek)</label>
        <textarea id="modal-lib-variants" rows="2"></textarea>

        <div class="btn-group">
          <button type="submit" class="btn">Uložit</button>
          <button type="button" id="btn-close-modal" class="btn btn-secondary">Zrušit</button>
        </div>
      </form>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" data-target="view-chat">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      Chat
    </button>
    <button class="nav-btn" data-target="view-library">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      Knihovna
    </button>
    <button class="nav-btn" data-target="view-memory">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      Paměť
    </button>
    <button class="nav-btn" data-target="view-settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      Nastavení
    </button>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
